<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="MEMRYA is in private development.">
  <title>MEMRYA — Private development</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e9e6de;color:#20242a;min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(720px,100%);background:#f7f4ed;border:1px solid #d7d1c5;border-radius:28px;padding:44px;box-shadow:0 18px 60px rgba(0,0,0,.08)}.brand{font-size:18px;font-weight:800;letter-spacing:.22em}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#18172a;color:#fff;margin-right:10px;letter-spacing:0}.eyebrow{margin:40px 0 12px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6557d9}h1{font-size:clamp(36px,7vw,64px);line-height:1.02;margin:0 0 18px;letter-spacing:-.04em}p{font-size:19px;line-height:1.6;color:#5f6670;margin:0;max-width:580px}.contact{margin-top:32px;font-size:15px}.contact a{color:#5546cf;text-decoration:none;font-weight:700}@media(max-width:600px){.card{padding:30px;border-radius:22px}p{font-size:17px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="mark">M</span>MEMRYA</div>
    <div class="eyebrow">Private development</div>
    <h1>We’re building something worth remembering.</h1>
    <p>MEMRYA is currently in private development. Product details and launch information will be published when they are ready.</p>
    <div class="contact"><a href="mailto:dev@memrya.co">dev@memrya.co</a></div>
  </main>
</body>
